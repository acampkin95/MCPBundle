name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run full quality checks
      run: |
        npm run type-check
        npm run lint
        npm run test:coverage

    - name: Build
      run: npm run build

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 30

  deploy-orchestrator:
    name: Deploy MCP-Orchestrator
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Deploy to VMI01
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VMI01_HOST }}
        username: ${{ secrets.VMI01_USER }}
        key: ${{ secrets.VMI01_SSH_KEY }}
        script: |
          cd /opt/mcp-orchestrator
          systemctl stop mcp-orchestrator
          rm -rf dist.backup
          mv dist dist.backup || true
          # Upload new build here
          systemctl start mcp-orchestrator
          systemctl status mcp-orchestrator

  health-check:
    name: Post-Deployment Health Check
    needs: deploy-orchestrator
    runs-on: ubuntu-latest

    steps:
    - name: Wait for service to start
      run: sleep 10

    - name: Check orchestrator health
      run: |
        curl -f http://${{ secrets.VMI01_HOST }}:9090/health || exit 1

    - name: Check metrics endpoint
      run: |
        curl -f http://${{ secrets.VMI01_HOST }}:9091/metrics || exit 1
