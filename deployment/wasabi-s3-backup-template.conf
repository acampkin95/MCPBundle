# rclone Configuration Template for Wasabi S3 Backup
#
# Instructions:
# 1. Install rclone on your backup server: apt-get install rclone
# 2. Copy this file to ~/.config/rclone/rclone.conf
# 3. Replace the placeholder values with your actual Wasabi credentials
# 4. Test the connection: rclone lsd wasabi-backup:
# 5. Set up automated sync using the provided backup scripts

[wasabi-backup]
type = s3
provider = Wasabi
env_auth = false

# REPLACE THESE WITH YOUR ACTUAL WASABI CREDENTIALS
access_key_id = YOUR_WASABI_ACCESS_KEY_ID
secret_access_key = YOUR_WASABI_SECRET_ACCESS_KEY

# Wasabi endpoint based on region
# US East 1 (N. Virginia): s3.wasabisys.com
# US East 2 (N. Virginia): s3.us-east-2.wasabisys.com
# US Central 1 (Texas): s3.us-central-1.wasabisys.com
# US West 1 (Oregon): s3.us-west-1.wasabisys.com
# EU Central 1 (Amsterdam): s3.eu-central-1.wasabisys.com
# EU Central 2 (Frankfurt): s3.eu-central-2.wasabisys.com
# EU West 1 (London): s3.eu-west-1.wasabisys.com
# EU West 2 (Paris): s3.eu-west-2.wasabisys.com
# AP Northeast 1 (Tokyo): s3.ap-northeast-1.wasabisys.com
# AP Northeast 2 (Osaka): s3.ap-northeast-2.wasabisys.com
# AP Southeast 1 (Singapore): s3.ap-southeast-1.wasabisys.com
# AP Southeast 2 (Sydney): s3.ap-southeast-2.wasabisys.com
endpoint = s3.wasabisys.com

# Region must match endpoint
region = us-east-1

# Leave these as default for Wasabi
location_constraint =
acl = private