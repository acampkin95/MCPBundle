# PostgreSQL 16 Configuration for VMI02D (Hot Standby + Storage)
# Role: Read-only replica, backup target, storage offload
# Hardware: Storage VPS 30 (1TB storage, moderate CPU/RAM)
#
# This configuration prioritizes:
# - Reliable replication lag monitoring
# - Read-only query serving
# - Storage efficiency for backups
# - Lower resource usage (storage-optimized hardware)

################################################################################
# CONNECTIONS AND SECURITY
################################################################################

listen_addresses = '10.0.0.2,127.0.0.1'  # Private LAN + localhost only
port = 5432
max_connections = 100                     # Fewer than primary (read-only)

# SSL/TLS
ssl = on
ssl_cert_file = '/etc/postgresql/16/main/server.crt'
ssl_key_file = '/etc/postgresql/16/main/server.key'

################################################################################
# MEMORY CONFIGURATION (Conservative for storage VPS)
################################################################################

# Shared memory (conservative for storage-optimized VPS)
shared_buffers = 512MB

# Cache hint for query planner
effective_cache_size = 1GB

# Per-operation memory limits
work_mem = 4MB                  # Conservative for read queries
maintenance_work_mem = 128MB
autovacuum_work_mem = 128MB

temp_buffers = 8MB

################################################################################
# WRITE-AHEAD LOG (STANDBY CONFIGURATION)
################################################################################

# Basic WAL settings
wal_level = replica
max_wal_size = 1GB
min_wal_size = 256MB

# Standby-specific
hot_standby = on
hot_standby_feedback = on        # Prevent query cancellations
max_standby_streaming_delay = 30s
max_standby_archive_delay = 60s

# Recovery settings (these go in standby.signal file)
# primary_conninfo will be set during replication setup
# restore_command will use WAL archive from /mnt/storage/backups/database/wal-archive

################################################################################
# REPLICATION (Standby Configuration)
################################################################################

# Allow this server to become primary if needed (failover)
max_wal_senders = 3
max_replication_slots = 3
wal_keep_size = 512MB

################################################################################
# QUERY PLANNER (Storage-optimized)
################################################################################

# Cost parameters (assume slower storage)
random_page_cost = 2.0           # Higher for storage-optimized disks
effective_io_concurrency = 100   # Moderate
seq_page_cost = 1.0

# Parallelism (conservative)
max_parallel_workers_per_gather = 1
max_parallel_workers = 2
max_worker_processes = 4

################################################################################
# STATISTICS AND MONITORING
################################################################################

# Query statistics
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 5000    # Fewer than primary

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = '/mnt/storage/logs/postgresql'  # Use 1TB storage
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# What to log (more verbose for standby monitoring)
log_line_prefix = '[STANDBY] %t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_connections = on
log_disconnections = on
log_replication_commands = on    # Important for standby
log_min_duration_statement = 5000  # Log queries > 5 seconds
log_statement = 'ddl'

# Standby-specific logging
log_recovery_conflict_waits = on
log_standby_snapshot_interval = 60s

################################################################################
# AUTOVACUUM (Less aggressive on standby)
################################################################################

autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 60s           # Check every minute

# Thresholds
autovacuum_vacuum_threshold = 100
autovacuum_vacuum_scale_factor = 0.2    # VACUUM at 20% dead tuples
autovacuum_analyze_threshold = 100
autovacuum_analyze_scale_factor = 0.1   # ANALYZE at 10% changed

################################################################################
# CLIENT CONNECTION DEFAULTS
################################################################################

datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

default_text_search_config = 'pg_catalog.english'

################################################################################
# LOCK MANAGEMENT
################################################################################

deadlock_timeout = 1s
max_locks_per_transaction = 64

################################################################################
# ARCHIVING (Standby also archives for redundancy)
################################################################################

archive_mode = always            # Archive even on standby
archive_command = 'test ! -f /mnt/storage/backups/database/wal-archive/%f && cp %p /mnt/storage/backups/database/wal-archive/%f'
