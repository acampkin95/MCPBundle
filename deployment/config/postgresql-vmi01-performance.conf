# PostgreSQL 16 Configuration for VMI01 (High Performance Primary)
# Optimized for: Write-heavy OLTP workload, MCP structured thought storage
# Hardware: Cloud VPS 20 SSD (~4GB RAM, 2-4 vCPU)
#
# This configuration prioritizes:
# - Low query latency (<10ms for simple queries)
# - High concurrent connection handling (100+ connections)
# - Write-heavy workload optimization
# - Aggressive caching in RAM

################################################################################
# CONNECTIONS AND SECURITY
################################################################################

listen_addresses = '10.0.0.1,127.0.0.1'  # Private LAN + localhost only
port = 5432
max_connections = 200                     # Allow many concurrent MCP agents

# SSL/TLS (enable in production)
ssl = on
ssl_cert_file = '/etc/postgresql/16/main/server.crt'
ssl_key_file = '/etc/postgresql/16/main/server.key'

################################################################################
# MEMORY CONFIGURATION
################################################################################

# Shared memory (25% of 4GB = 1GB)
shared_buffers = 1GB

# Cache hint for query planner (75% of 4GB = 3GB)
effective_cache_size = 3GB

# Per-operation memory limits
work_mem = 8MB                  # For sorting, hash tables (200 connections × 8MB = 1.6GB max)
maintenance_work_mem = 256MB    # For VACUUM, CREATE INDEX
autovacuum_work_mem = 256MB     # Separate from maintenance

# Temporary tables
temp_buffers = 16MB

################################################################################
# WRITE-AHEAD LOG (WAL) - OPTIMIZED FOR PERFORMANCE
################################################################################

# WAL size and checkpoints
wal_level = replica              # Enable streaming replication to VMI02D
max_wal_size = 2GB              # Allow large checkpoints
min_wal_size = 512MB
checkpoint_timeout = 15min       # Checkpoint every 15 minutes
checkpoint_completion_target = 0.9

# WAL writing behavior
wal_buffers = 16MB
wal_writer_delay = 200ms
commit_delay = 100               # Microseconds - group commits for throughput
commit_siblings = 5

# Archiving for backup (to VMI02D)
archive_mode = on
archive_command = 'rsync -a %p 10.0.0.2:/mnt/storage/backups/database/wal-archive/%f'
archive_timeout = 300            # Force archive every 5 minutes

################################################################################
# REPLICATION
################################################################################

# Streaming replication to VMI02D
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = 1GB
hot_standby = on
hot_standby_feedback = on

# Synchronous replication (optional - uncomment for zero data loss)
# synchronous_standby_names = 'standby_01'
# synchronous_commit = on

################################################################################
# QUERY PLANNER
################################################################################

# Cost parameters (tuned for SSD)
random_page_cost = 1.1           # SSD has low random access penalty
effective_io_concurrency = 200   # High for SSD
seq_page_cost = 1.0

# Parallelism
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_worker_processes = 8

################################################################################
# STATISTICS AND MONITORING
################################################################################

# Query statistics
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# Logging for debugging (reduce in production)
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# What to log
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_lock_waits = on
log_min_duration_statement = 1000  # Log queries > 1 second
log_statement = 'ddl'              # Log all DDL statements

# Performance insights
log_temp_files = 0                 # Log all temp files
log_autovacuum_min_duration = 0    # Log all autovacuum runs

################################################################################
# AUTOVACUUM - AGGRESSIVE FOR WRITE-HEAVY WORKLOAD
################################################################################

autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s           # Check every 30 seconds

# Trigger thresholds
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1    # VACUUM at 10% dead tuples
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05  # ANALYZE at 5% changed

# Cost limits (more aggressive)
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 1000

################################################################################
# CLIENT CONNECTION DEFAULTS
################################################################################

# Locale and formatting
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# Default text search configuration
default_text_search_config = 'pg_catalog.english'

################################################################################
# LOCK MANAGEMENT
################################################################################

deadlock_timeout = 1s
max_locks_per_transaction = 64

################################################################################
# EXTENSION-SPECIFIC
################################################################################

# For pg_trgm (full-text search)
# (loaded automatically when extension is created)

# For PostGIS (if used)
# shared_preload_libraries = 'pg_stat_statements,postgis'
