# Rclone Configuration for Wasabi S3
# Location: /root/.config/rclone/rclone.conf
#
# To configure, replace PLACEHOLDER values with actual credentials:
# - ACCESS_KEY_ID: Your Wasabi access key
# - SECRET_ACCESS_KEY: Your Wasabi secret key
#
# Then run: chmod 600 /root/.config/rclone/rclone.conf

[wasabi-vmi]
type = s3
provider = Wasabi
env_auth = false
access_key_id = ACCESS_KEY_ID_PLACEHOLDER
secret_access_key = SECRET_ACCESS_KEY_PLACEHOLDER
region = ap-southeast-2
endpoint = s3.ap-southeast-2.wasabisys.com
acl = private
server_side_encryption = AES256

# Optional: For better performance
[wasabi-vmi]
# Enable multipart uploads for files > 5MB
chunk_size = 5M
upload_concurrency = 4

# Connection settings
s3_upload_cutoff = 200M
s3_chunk_size = 5M
s3_no_check_bucket = false
s3_no_head = false
s3_no_head_object = false

# Disable upload checksums (wasabi calculates them server-side)
disable_checksum = false

# Retry settings
retries = 3
low_level_retries = 10
