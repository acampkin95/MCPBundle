version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.1
    container_name: keycloak
    hostname: auth.acdev.host
    restart: unless-stopped

    environment:
      # Database configuration - PostgreSQL on VMI01
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://46.250.243.123:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      # Keycloak admin credentials
      KEYCLOAK_ADMIN: alex.campkin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # Hostname configuration
      KC_HOSTNAME: auth.acdev.host
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false

      # HTTP configuration (use reverse proxy for HTTPS in production)
      KC_HTTP_ENABLED: true
      KC_HTTP_PORT: 8080
      KC_HTTPS_PORT: 8443

      # Proxy configuration
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded

      # Performance tuning
      KC_CACHE: ispn
      KC_CACHE_STACK: kubernetes

      # Logging
      KC_LOG_LEVEL: INFO
      KC_LOG_CONSOLE_OUTPUT: json

      # Health checks
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true

      # Feature flags
      KC_FEATURES: token-exchange,admin-fine-grained-authz,dynamic-scopes

    command:
      - start
      - --optimized
      - --import-realm

    ports:
      - "8080:8080"
      - "8443:8443"

    volumes:
      - ./realm-config.json:/opt/keycloak/data/import/realm-config.json:ro
      - keycloak-data:/opt/keycloak/data
      - ./certs:/opt/keycloak/certs:ro

    networks:
      - keycloak-net

    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

networks:
  keycloak-net:
    driver: bridge

volumes:
  keycloak-data:
    driver: local
