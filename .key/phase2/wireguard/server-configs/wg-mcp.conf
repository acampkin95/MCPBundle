# WireGuard MCP Tunnel Configuration
# Server: VMI03 (154.26.158.31)
# Network: 10.101.0.0/24
# Port: 51821
# Purpose: MCP agent communication to VMI01

[Interface]
Address = 10.101.0.1/24
ListenPort = 51821
PrivateKey = REPLACE_WITH_SERVER_PRIVATE_KEY

# Packet forwarding for MCP traffic
PostUp = iptables -A FORWARD -i wg-mcp -j ACCEPT
PostUp = iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

# Allow MCP protocol, database access, Keycloak OAuth
PostUp = iptables -A INPUT -i wg-mcp -p tcp --dport 5432 -j ACCEPT
PostUp = iptables -A INPUT -i wg-mcp -p tcp --dport 8080 -j ACCEPT

# Route to VMI01 (46.250.243.123) for MCP services
PostUp = ip route add 46.250.243.123/32 via 10.101.0.1 dev wg-mcp

# Allow access to Perplexity API (52.6.0.0/16 - AWS us-east-1 range)
PostUp = iptables -A FORWARD -i wg-mcp -d 52.6.0.0/16 -j ACCEPT
PostUp = iptables -A FORWARD -i wg-mcp -d 34.192.0.0/10 -j ACCEPT

PostDown = iptables -D FORWARD -i wg-mcp -j ACCEPT
PostDown = iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D INPUT -i wg-mcp -p tcp --dport 5432 -j ACCEPT
PostDown = iptables -D INPUT -i wg-mcp -p tcp --dport 8080 -j ACCEPT
PostDown = ip route del 46.250.243.123/32 via 10.101.0.1 dev wg-mcp
PostDown = iptables -D FORWARD -i wg-mcp -d 52.6.0.0/16 -j ACCEPT
PostDown = iptables -D FORWARD -i wg-mcp -d 34.192.0.0/10 -j ACCEPT

# MCP Agent Client 1
[Peer]
PublicKey = REPLACE_WITH_AGENT1_PUBLIC_KEY
PresharedKey = REPLACE_WITH_AGENT1_PSK
AllowedIPs = 10.101.0.10/32

# MCP Agent Client 2
[Peer]
PublicKey = REPLACE_WITH_AGENT2_PUBLIC_KEY
PresharedKey = REPLACE_WITH_AGENT2_PSK
AllowedIPs = 10.101.0.11/32

# Developer Machine Client
[Peer]
PublicKey = REPLACE_WITH_DEV_PUBLIC_KEY
PresharedKey = REPLACE_WITH_DEV_PSK
AllowedIPs = 10.101.0.20/32

# Additional MCP clients can be added here
# Allocate IPs from 10.101.0.10 - 10.101.0.254
