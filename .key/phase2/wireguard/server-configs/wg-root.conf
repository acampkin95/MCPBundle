# WireGuard Root Tunnel Configuration
# Server: VMI03 (154.26.158.31)
# Network: 10.100.0.0/24
# Port: 51820
# Purpose: Admin access to all VMs

[Interface]
Address = 10.100.0.1/24
ListenPort = 51820
PrivateKey = REPLACE_WITH_SERVER_PRIVATE_KEY

# Packet forwarding and NAT
PostUp = iptables -A FORWARD -i wg-root -j ACCEPT
PostUp = iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostUp = iptables -A FORWARD -i wg-root -o wg-root -j ACCEPT
# Allow SSH, VNC, RSync, PostgreSQL, Redis, Grafana
PostUp = iptables -A INPUT -i wg-root -p tcp --dport 22 -j ACCEPT
PostUp = iptables -A INPUT -i wg-root -p tcp --dport 5900:5909 -j ACCEPT
PostUp = iptables -A INPUT -i wg-root -p tcp --dport 873 -j ACCEPT
PostUp = iptables -A INPUT -i wg-root -p tcp --dport 5432 -j ACCEPT
PostUp = iptables -A INPUT -i wg-root -p tcp --dport 6379 -j ACCEPT
PostUp = iptables -A INPUT -i wg-root -p tcp --dport 3000 -j ACCEPT

PostDown = iptables -D FORWARD -i wg-root -j ACCEPT
PostDown = iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg-root -o wg-root -j ACCEPT
PostDown = iptables -D INPUT -i wg-root -p tcp --dport 22 -j ACCEPT
PostDown = iptables -D INPUT -i wg-root -p tcp --dport 5900:5909 -j ACCEPT
PostDown = iptables -D INPUT -i wg-root -p tcp --dport 873 -j ACCEPT
PostDown = iptables -D INPUT -i wg-root -p tcp --dport 5432 -j ACCEPT
PostDown = iptables -D INPUT -i wg-root -p tcp --dport 6379 -j ACCEPT
PostDown = iptables -D INPUT -i wg-root -p tcp --dport 3000 -j ACCEPT

# MacBook Client - Alex's Primary Admin Device
[Peer]
PublicKey = REPLACE_WITH_MACBOOK_PUBLIC_KEY
PresharedKey = REPLACE_WITH_MACBOOK_PSK
AllowedIPs = 10.100.0.10/32
# Client endpoint determined dynamically

# Mobile Client - iPhone/iPad Admin Access
[Peer]
PublicKey = REPLACE_WITH_MOBILE_PUBLIC_KEY
PresharedKey = REPLACE_WITH_MOBILE_PSK
AllowedIPs = 10.100.0.11/32
# Client endpoint determined dynamically

