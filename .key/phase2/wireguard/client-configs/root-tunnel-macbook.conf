# WireGuard Client Configuration - Root Tunnel
# Device: MacBook (FOTW_XVP7W61TJM)
# Network: 10.100.0.0/24
# Client IP: 10.100.0.10
# Purpose: Admin access to all VMs (split tunnel)

[Interface]
PrivateKey = REPLACE_WITH_CLIENT_PRIVATE_KEY
Address = 10.100.0.10/32
DNS = 1.1.1.1, 1.0.0.1

# Split tunnel - only route admin traffic over VPN
# Routes for VMI01 (46.250.243.123), VMI02D (46.250.241.70), VMI03 (154.26.158.31)
PostUp = route add 46.250.243.123/32 %i
PostUp = route add 46.250.241.70/32 %i
PostUp = route add 154.26.158.31/32 %i
PostUp = route add 10.100.0.0/24 %i

PostDown = route delete 46.250.243.123/32 %i
PostDown = route delete 46.250.241.70/32 %i
PostDown = route delete 154.26.158.31/32 %i
PostDown = route delete 10.100.0.0/24 %i

[Peer]
PublicKey = REPLACE_WITH_SERVER_PUBLIC_KEY
PresharedKey = REPLACE_WITH_PSK
Endpoint = 154.26.158.31:51820
# Split tunnel - only route admin endpoints
AllowedIPs = 10.100.0.0/24, 46.250.243.123/32, 46.250.241.70/32, 154.26.158.31/32
PersistentKeepalive = 25
